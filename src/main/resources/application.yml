spring:
  application:
    name: booking-system

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        TimeZone: Asia/Kolkata
        
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

razorpay:
  key:
    id: ${RAZORPAY_ID}
    secret: ${RAZORPAY_SECRET}

server:
  port: 4000
